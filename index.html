<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carte de visite GRAFFEUILLE</title>
<meta name="description" content="Coordonnées professionnelles GRAFFEUILLE / Turgis Gaillard.">
<meta name="theme-color" content="#e63329">
<meta name="robots" content="noindex">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Inter:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<link rel="stylesheet" href="assets/css/carte.css">
</head>
<body>

<main class="sheet" id="card" hidden>
  <header class="crest" id="crest"></header>

  <section class="identity" id="identity"></section>

  <nav class="links" id="links" aria-label="Coordonnées"></nav>

  <div class="actions">
    <a class="cta" id="btn-vcf" href="#">Ajouter à mes contacts</a>
    <button type="button" class="secondary" id="btn-share">Partager cette carte</button>
  </div>

  <footer class="foot" id="foot"></footer>
</main>

<section class="sheet missing" id="missing" hidden>
  <h1>Carte introuvable</h1>
  <p id="missing-text"></p>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/js/icons.js"></script>
<script src="assets/js/logo.js"></script>
<script src="assets/js/contact.js"></script>
<script src="assets/js/carte.js"></script>
</body>
</html>
